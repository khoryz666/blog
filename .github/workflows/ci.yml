name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Fails on any Hugo warning, so a theme or Hugo update that needs a
      # config change never reaches main.
      - run: nix build -L
