name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same file Cloudflare Pages reads, so CI fails (and blocks the
          # Dependabot auto-merge) whenever a bump needs a newer Node.
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
