name: Update

# Every week: bump everything in flake.lock (Hugo, PaperMod, the Obsidian Git
# plugin), and push to main only if the site still builds.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start CI, which deploys

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake update
      - run: nix run .#obsidian-plugins
      - run: nix build -L
      - name: Push and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add flake.lock .obsidian/plugins
          git diff --cached --quiet && { echo "already up to date"; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): update flake.lock'
          git push
          # A push made with GITHUB_TOKEN doesn't start other workflows, so start CI by hand.
          gh workflow run ci.yml --ref main
